name: Bug
description: Something is broken in Grok Web
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use a [security advisory](https://github.com/icekale/grok-web/security/advisories/new) instead of a public issue if this could expose a password, session, or local files.
  - type: input
    id: version
    attributes:
      label: Grok Web version
      placeholder: "0.10.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.19.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
